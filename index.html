  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,#0b1526 100%)\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:clamp(80px,12vw,176px) clamp(20px,4vw,48px) clamp(64px,9vw,128px)\">\n    <div style=\"display:flex;flex-direction:column;gap:28px;max-width:780px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;color:#6f95ff\">PHYSICAL AI FOR THE LIFE SCIENCES<\u002Fspan>\n      <h1 style=\"margin:0;font-size:clamp(40px,5.6vw,84px);line-height:1.02;font-weight:500;letter-spacing:-.03em;text-wrap:pretty\"><span style=\"display:block\">Self-driving<\u002Fspan><span style=\"display:block;color:#6f95ff\">biology labs<\u002Fspan><\u002Fh1>\n      <p style=\"margin:0;font-size:clamp(17px,1.4vw,21px);line-height:1.45;color:#b7c2d6;max-width:600px;text-wrap:pretty\">Tell the lab what to do, not how to do it. Physical AI models drive the robots to do all the hands-on work, and your samples become data without a human touching them.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:8px\">\n        <a href=\"#lab\" style=\"background:#1d4fd8;color:#fff;padding:14px 22px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.14em\" style-hover=\"background:#fff;color:#0b1526\">HOW IT WORKS<\u002Fa>\n        <a href=\"#book\" style=\"border:2px solid rgba(255,255,255,.6);color:#fff;padding:12px 22px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.14em\" style-hover=\"background:#fff;color:#0b1526;border-color:#fff\">SEND US SAMPLES<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.14)\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:18px clamp(20px,4vw,48px);display:flex;flex-wrap:wrap;align-items:center;gap:12px 36px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;color:#8a97ad;line-height:1.6\">\n      <span style=\"display:flex;align-items:center;gap:12px;color:#b7c2d6\"><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#3cc497;box-shadow:0 0 0 4px rgba(60,196,151,.2)\"><\u002Fspan>PROCESSING SAMPLES NOW<\u002Fspan>\n      <span>NEW YORK, NY<\u002Fspan>\n      <span>WGS AVAILABLE<\u002Fspan>\n      <span>WES · RNA-SEQ · PPMSEQ COMING SOON<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" style=\"background:#fff;color:#0b1526\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(20px,4vw,48px)\">\n    <div data-split=\"\" style=\"display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,96px);align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <h2 style=\"margin:0;font-size:clamp(30px,3.6vw,52px);line-height:1.08;font-weight:500;letter-spacing:-.025em;text-wrap:pretty\">Science is getting faster everywhere except the bench.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;font-size:clamp(17px,1.3vw,20px);line-height:1.55;color:#4a5568\">\n        <p style=\"margin:0\">AI is rapidly accelerating hypothesis generation, experiment design, and interpretation, and the pace is only increasing. Generating the data in between still depends on a person with a pipette.<\u002Fp>\n        <p style=\"margin:0\">Lab work is expensive, slow, and error-prone, and hiring more hands doesn't fix it. In most scientific environments the limiting factor is time, and we think scientists should spend theirs on science, not manual labor.<\u002Fp>\n        <p style=\"margin:0;color:#0b1526;font-weight:500\">We're building a lab where the bench keeps up.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:clamp(40px,5vw,64px)\">\n      <div data-loop=\"\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:#dfe4ec;border:2px solid #dfe4ec;border-radius:6px;overflow:hidden\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:28px 24px;background:#fff;color:#0b1526\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#1d4fd8\">01<\u002Fspan>\n          <span style=\"font-size:clamp(19px,1.6vw,22px);font-weight:600;letter-spacing:-.01em;line-height:1.2\">Hypothesis generation<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.5;color:#4a5568;flex:1\">Human scientists paired with AI propose candidate hypotheses faster than any lab can test them.<\u002Fspan>\n          <span style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;padding:6px 10px;border:1.5px solid #158a5e;color:#158a5e;padding:4.5px 8.5px\">AI ACCELERATION<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:28px 24px;background:#fff;color:#0b1526\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#1d4fd8\">02<\u002Fspan>\n          <span style=\"font-size:clamp(19px,1.6vw,22px);font-weight:600;letter-spacing:-.01em;line-height:1.2\">Experiment design<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.5;color:#4a5568;flex:1\">Protocols, controls, and power calculations drafted in minutes.<\u002Fspan>\n          <span style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;padding:6px 10px;border:1.5px solid #158a5e;color:#158a5e;padding:4.5px 8.5px\">AI ACCELERATION<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:28px 24px;background:#0b1526;color:#fff\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#6f95ff\">03<\u002Fspan>\n          <span style=\"font-size:clamp(19px,1.6vw,22px);font-weight:600;letter-spacing:-.01em;line-height:1.2\">Data generation<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.5;color:#b7c2d6;flex:1\">Pipettes, plates, and people. Still manual, still the bottleneck.<\u002Fspan>\n          <span style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;padding:6px 10px;background:#fff;color:#0b1526\">BLOCKED · MANUAL<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:28px 24px;background:#fff;color:#0b1526\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#1d4fd8\">04<\u002Fspan>\n          <span style=\"font-size:clamp(19px,1.6vw,22px);font-weight:600;letter-spacing:-.01em;line-height:1.2\">Interpretation<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.5;color:#4a5568;flex:1\">Analysis and model training run at machine speed.<\u002Fspan>\n          <span style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;padding:6px 10px;border:1.5px solid #158a5e;color:#158a5e;padding:4.5px 8.5px\">AI ACCELERATION<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-loop-return=\"\" style=\"position:relative;height:36px;margin:0 clamp(40px,12%,160px)\">\n        <svg sc-camel-view-box=\"0 0 1000 36\" sc-camel-preserve-aspect-ratio=\"none\" width=\"100%\" height=\"36\" style=\"position:absolute;inset:0;display:block;overflow:visible\"><path d=\"M1000 0 V22 Q1000 30 992 30 H8 Q0 30 0 22 V6\" fill=\"none\" stroke=\"#c9d2e0\" stroke-width=\"1.5\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg>\n        <svg sc-camel-view-box=\"0 0 12 8\" width=\"12\" height=\"8\" style=\"position:absolute;left:-6px;top:0;display:block\"><path d=\"M1 7 L6 1 L11 7\" fill=\"none\" stroke=\"#c9d2e0\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"lab\" style=\"background:#f3f5f8;color:#0b1526\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:clamp(36px,5vw,56px)\">\n    <div data-split=\"\" style=\"display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:start\">\n      <h2 style=\"margin:0;font-size:clamp(30px,3.6vw,52px);line-height:1.08;font-weight:500;letter-spacing:-.025em;text-wrap:pretty\">Inside our lab, only robots touch samples.<\u002Fh2>\n      <p style=\"margin:0;font-size:clamp(17px,1.3vw,20px);line-height:1.55;color:#4a5568;text-wrap:pretty\">Automating one instrument still leaves a scientist standing next to it. We are building the whole lab as one system: the hardware, the physical AI that runs it, and the software that keeps track of it all.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr)\">\n      <div style=\"display:flex;flex-direction:column;justify-content:center;gap:8px\">\n        <div data-layer=\"\" style=\"display:grid;grid-template-columns:minmax(84px,118px) minmax(0,1fr);gap:18px;padding:20px 22px;background:#fff;color:#0b1526;border:1.5px solid #dfe4ec;border-radius:4px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:#8a97ad\"><span>01<\u002Fspan><span style=\"color:#1d4fd8\">INTENT<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:19px;font-weight:600;letter-spacing:-.01em\">Human + AI scientist<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:#4a5568\">Hypothesis, experimental design, and evaluation. You decide what to run.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-layer=\"\" style=\"display:grid;grid-template-columns:minmax(84px,118px) minmax(0,1fr);gap:18px;padding:20px 22px;background:#1d4fd8;color:#fff;border:1.5px solid #1d4fd8;border-radius:4px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.75)\"><span>02<\u002Fspan><span style=\"color:#fff\">TRANSLATION<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:19px;font-weight:600;letter-spacing:-.01em\">Software platform<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:rgba(255,255,255,.85)\">Turns intent into protocols, orchestrates runs, and collects data.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-layer=\"\" style=\"display:grid;grid-template-columns:minmax(84px,118px) minmax(0,1fr);gap:18px;padding:20px 22px;background:#1d4fd8;color:#fff;border:1.5px solid #1d4fd8;border-radius:4px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.75)\"><span>03<\u002Fspan><span style=\"color:#fff\">EXECUTION<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:19px;font-weight:600;letter-spacing:-.01em\">Physical AI models<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:rgba(255,255,255,.85)\">Executes wet-lab protocols<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-layer=\"\" style=\"display:grid;grid-template-columns:minmax(84px,118px) minmax(0,1fr);gap:18px;padding:20px 22px;background:#1d4fd8;color:#fff;border:1.5px solid #1d4fd8;border-radius:4px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.75)\"><span>04<\u002Fspan><span style=\"color:#fff\">INFRASTRUCTURE<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:19px;font-weight:600;letter-spacing:-.01em\">Scalable lab hardware<\u002Fspan><span style=\"font-size:15px;line-height:1.5;color:rgba(255,255,255,.85)\">Modular, AI-native workstations. Capacity grows one unit at a time.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  \n      \n    \n<\u002Fsection>\n\n<section id=\"vision\" style=\"background:#fff;color:#0b1526\">\n  <div data-split=\"\" style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(20px,4vw,48px);display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:center\">\n    <h2 style=\"margin:0;font-size:clamp(28px,3.9vw,50px);line-height:1.06;font-weight:500;letter-spacing:-.03em;text-wrap:balance\" data-stmt=\"\"><span style=\"display:block\">The data centers of biology<\u002Fspan><span style=\"display:block\">will be filled with <span style=\"color:#1d4fd8\">robots<\u002Fspan>,<\u002Fspan><span style=\"display:block\">not servers.<\u002Fspan><\u002Fh2>\n    <p style=\"margin:0;font-size:clamp(17px,1.3vw,20px);line-height:1.55;color:#4a5568;text-wrap:pretty\">Standardized, autonomous infrastructure running around the clock. We operate it today. Once proven at scale, we'll deploy it to other labs. The goal is always the same: scientists spend less time moving plates and more time doing science. That's the whole point.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"services\" style=\"background:#f3f5f8;color:#0b1526\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:clamp(36px,5vw,56px)\">\n    <div data-split=\"\" style=\"display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,96px);align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <h2 style=\"margin:0;font-size:clamp(30px,3.6vw,52px);line-height:1.08;font-weight:500;letter-spacing:-.025em;text-wrap:pretty\">And yes, we take samples.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;font-size:clamp(17px,1.3vw,20px);line-height:1.55;color:#4a5568\">\n        <p style=\"margin:0\">The best way to build real lab infrastructure is to run one. So we offer sequencing as a service: send us a plate, get back data. Designed to reduce cost, turnaround time, and errors.<\u002Fp>\n        <p style=\"margin:0;color:#0b1526;font-weight:500\">Available now for research use, with more assays on the way.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <div data-row=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) 160px;gap:12px 24px;align-items:center;padding:20px 0;border-top:1px solid #c9d2e0\"><span style=\"font-size:clamp(20px,1.8vw,24px);font-weight:600;letter-spacing:-.01em\">WGS<\u002Fspan><span style=\"font-size:16px;line-height:1.5;color:#4a5568\">Whole-genome sequencing<\u002Fspan><span style=\"display:flex;justify-content:flex-start\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;background:#158a5e;color:#fff;padding:6px 0;display:inline-flex;justify-content:center;width:150px;box-sizing:border-box;white-space:nowrap\">AVAILABLE NOW<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div data-row=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) 160px;gap:12px 24px;align-items:center;padding:20px 0;border-top:1px solid #c9d2e0\"><span style=\"font-size:clamp(20px,1.8vw,24px);font-weight:600;letter-spacing:-.01em\">WES<\u002Fspan><span style=\"font-size:16px;line-height:1.5;color:#4a5568\">Whole-exome sequencing<\u002Fspan><span style=\"display:flex;justify-content:flex-start\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;border:1.5px solid #158a5e;color:#158a5e;padding:4.5px 0;display:inline-flex;justify-content:center;width:150px;b .<\u002Fspan><\u002Fsc-if>\n        \n      <\u002Fsc-if>\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:24px 0\">\n          <span style=\"width:44px;height:44px;border-radius:50%;background:#158a5e;display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 20 20\" width=\"22\" height=\"22\"><path d=\"M 4 10.5 L 8.5 15 L 16 5.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-size:20px;font-weight:600\">Request received.<\u002Fspan>\n          <span style=\"font-size:15px;color:#4a5568;line-height:1.5\">We'll be in touch at {{ sentEmail }} within one business day.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#0b1526;color:#fff;border-top:1px solid rgba(255,255,255,.14)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:clamp(32px,4vw,48px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:20px 48px;padding-bottom:clamp(28px,4vw,40px);border-bottom:1px solid rgba(255,255,255,.18)\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;color:#b7c2d6\">BACKED BY<\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:20px 40px\">\n        <img src=\"a1acd5e8-fad1-47b3-9792-40aef6ad833c\" alt=\"SOSV\" style=\"height:26px;width:auto;display:block;opacity:.92\">\n        <img src=\"4d6b50d4-7fd8-48cb-9f41-7d60fda952f9\" alt=\"Boost VC\" style=\"height:18px;width:auto;display:block;opacity:.92\">\n        <img src=\"2c485f8c-6cd6-4ddb-a9e1-bbc185a18fcc\" alt=\"Draper B1\" style=\"height:18px;width:auto;display:block;opacity:.92\">\n        <img src=\"f713cf25-20a3- ipt type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;hubspotPortalId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;243505211&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;HubSpot&quot;},&quot;hubspotFormGuid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;bf2d709c-1e7f-40ab-a471-730f2d2ceeec&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;HubSpot&quot;}}\">\nclass Component extends DCLogic {\n  state = { sent: false, sentEmail: '' };\n  async submitToHubSpot(e) {\n    e.preventDefault();\n    const f = e.target.elements;\n    const email = f.email.value.trim();\n    const personal = ['gmail.com','googlemail.com','yahoo.com','ymail.com','hotmail.com','outlook.com','live.com','msn.com','aol.com','icloud.com','me.com','mac.com','proton.me','protonmail.com','gmx.com','gmx.de','mail.com','yandex.com','yandex.ru','zoho.com','qq.com','163.com','126.com'];\n    const checks = [\n      [f.name, f.name.value.trim() ? '' : 'Please enter your name.'],\n      [f.company, f.company.value.trim() ? '' : 'Please enter your company or institution.'],\n      [f.email, personal.includes((email.split('@')[1] || '').toLowerCase()) ? 'Please use your work or institutional email.' : ''],\n      [f.project, f.project.value.trim() ? '' : 'Please describe your project.'],\n    ];\n    for (const [el, msg] of checks) el.setCustomValidity(msg);\n    const bad = checks.find(([, msg]) => msg);\n    if (bad) { bad[0].reportValidity(); const clear = () => { bad[0].setCustomValidity(''); bad[0].removeEventListener('input', clear); }; bad[0].addEventListener('input', clear); return; }\n    const [firstname, ...rest] = f.name.value.trim().split(/\\s+/);\n    const portalId = this.props.hubspotPortalId || '243505211', formGuid = this.props.hubspotFormGuid || 'bf2d709c-1e7f-40ab-a471-730f2d2ceeec';\n    if (!portalId || !formGuid) { console.warn('HubSpot IDs not set, simulating success'); this.setState({ sent: true, sentEmail: email }); return; }\n    const hutk = (document.cookie.match(/(?:^|;\\s*)hubspotutk=([^;]+)/) || [])[1];\n    const body = {\n      fields: [\n        { name: 'firstname', value: firstname || '' },\n        { name: 'lastname', value: rest.join(' ') },\n        { name: 'email', value: email },\n        { name: 'company', value: f.company.value.trim() },\n        { name: 'service_interest', value: f.service.options[f.service.selectedIndex].text },\n        { name: 'sample_volume', value: f.samples.options[f.samples.selectedIndex].text },\n        { name: 'project_description', value: f.project.value },\n      ],\n      context: { pageUri: location.href, pageName: document.title, ...(hutk ? { hutk } : {}) },\n    };\n    this.setState({ sending: true, error: false });\n    try {\n      const r = await fetch(`https://api.hsforms.com/submissions/v3/integration/submit/${portalId}/${formGuid}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });\n      if (!r.ok) throw new Error(await r.text());\n      this.setState({ sending: false, sent: true, sentEmail: email });\n    } catch (err) { console.error('HubSpot submit failed', err); this.setState({ sending: false, error: true }); }\n  }\n  renderVals() {\n    return {\n      sent: this.state.sent, notSent: !this.state.sent, sentEmail: this.state.sentEmail,\n      sending: !!this.state.sending, error: !!this.state.error,\n      submitLabel: this.state.sending ? 'SENDING…' : 'REQUEST A QUOTE',\n      submit: (e) => this.submitToHubSpot(e),\n      formKeyDown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !this.state.sending) { e.preventDefault(); e.currentTarget.requestSubmit(); } },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
